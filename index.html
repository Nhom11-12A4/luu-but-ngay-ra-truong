<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title></title>
<style>
@font-face {
  font-family: 'Fz Cat Comic';
  src: url('./FzCatComic.ttf') format('truetype');
}
body {
    font-family: 'Fz Cat Comic', sans-serif;
}
  body{
  margin:0;
  height:100vh;
  background: radial-gradient(circle at bottom, #0f2027, #203a43, #2c5364);
  overflow:hidden;
}

.stars{
  position:relative;
  width:100%;
  height:100%;
}

.star{
  position:absolute;
  width:3px;
  height:3px;
  background:white;
  border-radius:50%;
  opacity:0;
  animation: twinkle 3s infinite ease-in-out;
}

@keyframes twinkle{
  0%{
    opacity:0;
    transform:scale(0.5);
  }
  50%{
    opacity:1;
    transform:scale(2);
  }
  100%{
    opacity:0;
    transform:scale(0.5);
  }
}
.text-title{
  font-size:80px;
  font-weight:900;
  color:#7df9ff;
  text-shadow:0 0 15px #00eaff, 0 0 30px #00eaff;
  font-family:"Fz Cat Comic", sans-serif;
}
.text{
  font-size:28px;
  font-weight:400;
  color:#ffd6ff;
  text-shadow:0 0 10px rgba(255,255,255,0.6);
}
.text-align{
  position:absolute; 
  top:10%;
  left:50%;
  transform:translateX(-50%);
  text-align: center;
}
.text-align1{
  position:absolute; 
  top:80%;
  left:33%;
  transform:translateX(-50%);
  text-align: center;
}
.text-align2{
  position:absolute;
  top:80%;
  left:62%;
  transform:translateX(-50%);
  text-align: center;
}
.sach{
  position:absolute;
  bottom:20px;
  right:20px;
  width:200px;
  height:400px;
}

.sach img{
  width:100%;
  height:100%;
  object-fit:contain;
}
a{
  color:#fff3b0;
  text-decoration:none;
}

a:hover{
  color:#ffffff;
}
.circle{
  position:absolute;
  bottom:-300px;
  left:50%;
  width:900px;
  height:900px;
  transform:translateX(-50%);
  animation:spin 30s linear infinite;
}
.circle img{
  border:3px solid white;
  box-shadow:0 0 15px rgba(255,255,255,0.7);
}
.circle img:hover{
  transform:scale(1.3);
  transition:0.3s;
}
.circle img{
  position:absolute;
  top:50%;
  left:50%;
  width:120px;
  height:120px;
  object-fit:cover;
  border-radius:15px;
  transform-origin:-420px center;
}
/* 6 ảnh trên vòng tròn */

.circle img:nth-child(1){ transform:rotate(0deg) translate(420px); }
.circle img:nth-child(2){ transform:rotate(60deg) translate(420px); }
.circle img:nth-child(3){ transform:rotate(120deg) translate(420px); }
.circle img:nth-child(4){ transform:rotate(180deg) translate(420px); }
.circle img:nth-child(5){ transform:rotate(240deg) translate(420px); }
.circle img:nth-child(6){ transform:rotate(300deg) translate(420px); }
@keyframes spin{
  from{
    transform:translateX(-50%) rotate(0deg);
  }
  to{
    transform:translateX(-50%) rotate(360deg);
  }
}
  .circle img{
  border:3px solid white;
}
  .circle img:hover{
  transform:scale(1.3);
  transition:0.3s;
}
</style>
</head>

<body>
<div class="circle">
  <img src="lop.jpg">
  <img src="cong.jpg">
  <img src="26-3.jpg">
  <img src="aodoan.jpg">
  <img src="thamco.jpg">
  <img src="san.jpg">
</div>
<div class="stars">
  <div class="star" style="top:10%; left:20%; animation-delay:0s;"></div>
  <div class="star" style="top:30%; left:40%; animation-delay:1s;"></div>
  <div class="star" style="top:50%; left:70%; animation-delay:2s;"></div>
  <div class="star" style="top:80%; left:10%; animation-delay:0.5s;"></div>
  <div class="star" style="top:60%; left:55%; animation-delay:1.5s;"></div>
  <div class="star" style="top:20%; left:85%; animation-delay:2.5s;"></div>
  <div class="star" style="top:75%; left:35%; animation-delay:0.8s;"></div>
  <div class="star" style="top:40%; left:15%; animation-delay:1.2s;"></div>
  <div class="star" style="top:90%; left:45%; animation-delay:2s;"></div>
  <div class="star" style="top:90%; left:80%; animation-delay:0.7s;"></div>
</div>
<div class="text-title text-align"><b>LƯU BÚT NGÀY <br>RA TRƯỜNG</b></div>

</html>
