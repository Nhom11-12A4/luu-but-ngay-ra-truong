<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Lưu bút</title>
<style>
@font-face {
  font-family: 'Fz Cat Comic';
  src: url('./FzCatComic.ttf') format('truetype');
}
body {
  font-family: 'Fz Cat Comic', sans-serif;
  margin:0;
  min-height:200vh; /* Cho phép cuộn xuống */
  background: radial-gradient(circle at bottom, #0f2027, #203a43, #2c5364);
}

/* Stars */
.stars{position:relative;width:100%;height:100%;}
.star{position:absolute;width:3px;height:3px;background:white;border-radius:50%;opacity:0;animation:twinkle 3s infinite ease-in-out;}
@keyframes twinkle{0%{opacity:0;transform:scale(0.5);}50%{opacity:1;transform:scale(2);}100%{opacity:0;transform:scale(0.5);}}

.text-title{
  font-size:70px;font-weight:900;color:#7df9ff;
  text-shadow:0 0 15px #00eaff,0 0 30px #00eaff;
  text-align:center;
  position:absolute;top:5%;left:50%;transform:translateX(-50%);
}

/* Timeline section */
.timeline{
  position:relative;
  margin-top:120vh; /* Đẩy xuống để phải kéo mới thấy */
  display:flex;gap:40px;justify-content:center;
}
.card{
  width:260px;padding:10px;border-radius:15px;
  background:rgba(255,255,255,0.1);
  backdrop-filter:blur(6px);
  border:2px solid rgba(255,255,255,0.4);
  color:white;text-align:center;
  box-shadow:0 0 15px rgba(255,255,255,0.3);
}
.card img{
  width:100%;height:140px;object-fit:cover;border-radius:10px;
  border:2px solid white;
}
.card h3{margin:5px 0;color:#ffd6ff;}
.card p{font-size:14px;}
</style>
</head>
<body>

<div class="text-title">LƯU BÚT NGÀY RA TRƯỜNG</div>

<div class="stars">
  <div class="star" style="top:10%; left:20%; animation-delay:0s;"></div>
  <div class="star" style="top:30%; left:40%; animation-delay:1s;"></div>
  <div class="star" style="top:50%; left:70%; animation-delay:2s;"></div>
  <div class="star" style="top:80%; left:10%; animation-delay:0.5s;"></div>
  <div class="star" style="top:60%; left:55%; animation-delay:1.5s;"></div>
  <div class="star" style="top:20%; left:85%; animation-delay:2.5s;"></div>
  <div class="star" style="top:75%; left:35%; animation-delay:0.8s;"></div>
</div>

<!-- Timeline section -->
<div class="timeline">
  <div class="card">
    <img src="lop10.jpg" alt="Lớp 10">
    <h3>Lớp 10</h3>
    <p>Những ngày đầu làm quen, bỡ ngỡ nhưng đầy háo hức.</p>
  </div>

  <div class="card">
    <img src="lop11.jpg" alt="Lớp 11">
    <h3>Lớp 11</h3>
    <p>Nhiều hoạt động, trưởng thành hơn, gắn kết bạn bè.</p>
  </div>

  <div class="card">
    <img src="lop12.jpg" alt="Lớp 12">
    <h3>Lớp 12</h3>
    <p>Ôn thi, kỷ niệm, những cảm xúc cuối cấp khó quên.</p>
  </div>
</div>



<!-- Closing quote -->
<div class="final-section">
  <p class="final-quote">“Lớp tui có lúc cãi nhau, có lúc cười muốn xỉu, nhưng chưa bao giờ rời nhau khi cần.”</p>
</div>

<style>
.final-section{
  text-align:center;
  margin:120px 0 80px 0;
  color:white;
}
.final-quote{
  font-size:36px;
  font-weight:900;
  text-shadow:0 0 20px #00eaff;
}
</style>

</body>
</html>
